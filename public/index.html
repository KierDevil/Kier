<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple CRUD</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #f5f7fb; }
    .card { background: white; padding: 1rem 1.25rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 1rem; }
    form { display: grid; gap: 0.6rem; max-width: 420px; }
    input, button { padding: 0.7rem; font-size: 1rem; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button.delete { background: #dc2626; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid #ddd; padding: 0.6rem; text-align: left; }
    .message { color: #b91c1c; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Simple CRUD</h1>
    <form id="recordForm">
      <input id="name" placeholder="Name" required />
      <input id="email" type="email" placeholder="Email" required />
      <input id="role" placeholder="Role" required />
      <button id="submitBtn" type="submit">Add Record</button>
    </form>
    <div id="message" class="message"></div>
  </div>

  <div class="card">
    <h2>Records</h2>
    <table>
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('recordForm');
    const recordsBody = document.getElementById('recordsBody');
    const message = document.getElementById('message');
    const submitBtn = document.getElementById('submitBtn');
    let editingId = null;

    async function loadRecords() {
      const res = await fetch('/api/items');
      const items = await res.json();
      recordsBody.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.name}</td>
          <td>${item.email}</td>
          <td>${item.role}</td>
          <td>
            <button onclick="editRecord('${item.id}', '${item.name}', '${item.email}', '${item.role}')">Edit</button>
            <button class="delete" onclick="deleteRecord('${item.id}')">Delete</button>
          </td>`;
        recordsBody.appendChild(row);
      });
    }

    window.editRecord = function(id, name, email, role) {
      editingId = id;
      document.getElementById('name').value = name;
      document.getElementById('email').value = email;
      document.getElementById('role').value = role;
      submitBtn.textContent = 'Save Changes';
      message.textContent = 'Editing record';
    };

    window.deleteRecord = async function(id) {
      if (!confirm('Delete this record?')) return;
      const res = await fetch(`/api/items/${id}`, { method: 'DELETE' });
      if (res.ok) {
        message.textContent = 'Record deleted.';
        loadRecords();
      } else {
        message.textContent = 'Unable to delete record.';
      }
    };

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const payload = {
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        role: document.getElementById('role').value.trim()
      };
      if (!payload.name || !payload.email || !payload.role) {
        message.textContent = 'Please fill in all fields.';
        return;
      }

      const method = editingId ? 'PUT' : 'POST';
      const url = editingId ? `/api/items/${editingId}` : '/api/items';
      const res = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!res.ok) {
        message.textContent = data.error || 'Could not save record.';
        return;
      }

      form.reset();
      editingId = null;
      submitBtn.textContent = 'Add Record';
      message.textContent = editingId ? 'Record updated.' : 'Record added.';
      loadRecords();
    });

    loadRecords();
  </script>
</body>
</html>
